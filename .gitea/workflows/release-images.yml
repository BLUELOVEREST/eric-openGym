name: Build And Push Eric openGym Images

on:
  push:
    tags:
      - 'v*-eric.*'

# Avoid concurrent publication of the two latest aliases.
concurrency:
  group: opengym-release-images
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ci
    timeout-minutes: 60
    defaults:
      run:
        shell: sh
    env:
      REGISTRY: 192.168.200.101:54453
      API_IMAGE_REPOSITORY: zhangzhicheng/opengym-api
      WEB_IMAGE_REPOSITORY: zhangzhicheng/opengym-web
      SOURCE_URL: https://gitea.blueloverest.site:44443/zhangzhicheng/eric-openGym
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Validate fork tag and set shared metadata
        run: |
          set -eu
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const tag = process.env.GITHUB_REF_NAME
          const match = /^v(\d+\.\d+\.\d+)-eric\.([1-9]\d*)$/.exec(tag || '')
          if (!match || process.env.GITHUB_REF !== `refs/tags/${tag}`) {
            throw new Error('Expected an immutable vX.Y.Z-eric.N release tag')
          }
          for (const name of ['api', 'frontend']) {
            const pkg = JSON.parse(readFileSync(`${name}/package.json`, 'utf8'))
            if (pkg.version !== match[1]) throw new Error(`${name} version disagrees with ${tag}`)
          }
          if (!/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA || '')) {
            throw new Error('Expected a full commit SHA')
          }
          NODE
          printf 'VERSION=%s\nVCS_REF=%s\nBUILD_DATE=%s\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Install test dependencies
        run: |
          set -eu
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix api --omit=optional --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund

      - name: Native source tests and generated assets
        run: |
          set -eu
          node --test scripts/ci/release-images.test.mjs
          node --test --test-concurrency=2 api/test/*.test.js
          npm test --prefix frontend -- --maxWorkers=2
          node scripts/catalogue/build.mjs --check
          node scripts/build-coach-assets.mjs --check
          node scripts/build-api-docs.mjs --check
          node api/scripts/check-core-loadable.mjs
          node frontend/scripts/check-locales.mjs
          node scripts/catalogue/check-media.mjs

      - name: Build API image (default, no Coach runtime)
        run: |
          set -eu
          docker build --target default -f api/Dockerfile \
            --build-arg VERSION="$VERSION" \
            --build-arg VCS_REF="$VCS_REF" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.url=$SOURCE_URL" \
            --label "org.opencontainers.image.documentation=$SOURCE_URL/src/tag/$VERSION/docs/SELF_HOSTING.md" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            -t "$REGISTRY/$API_IMAGE_REPOSITORY:$VERSION" \
            -t "$REGISTRY/$API_IMAGE_REPOSITORY:sha-$VCS_REF" \
            -t "$REGISTRY/$API_IMAGE_REPOSITORY:latest" ./api

      - name: Build web image (licensed 180 px catalogue media)
        run: |
          set -eu
          docker build -f web/Dockerfile \
            --build-arg VERSION="$VERSION" \
            --build-arg VCS_REF="$VCS_REF" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg APP_BUILD="$VERSION" \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.url=$SOURCE_URL" \
            --label "org.opencontainers.image.documentation=$SOURCE_URL/src/tag/$VERSION/docs/SELF_HOSTING.md" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            -t "$REGISTRY/$WEB_IMAGE_REPOSITORY:$VERSION" \
            -t "$REGISTRY/$WEB_IMAGE_REPOSITORY:sha-$VCS_REF" \
            -t "$REGISTRY/$WEB_IMAGE_REPOSITORY:latest" .

      - name: Login to Gitea Registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -eu
          test -n "$REGISTRY_USER"
          test -n "$REGISTRY_PASSWORD"
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Push both images (version, SHA, then latest)
        run: |
          set -eu
          for tag in "$VERSION" "sha-$VCS_REF" latest; do
            docker push "$REGISTRY/$API_IMAGE_REPOSITORY:$tag"
            docker push "$REGISTRY/$WEB_IMAGE_REPOSITORY:$tag"
          done

      - name: Logout of registry
        if: always()
        run: docker logout "$REGISTRY"
